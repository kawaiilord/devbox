name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sameframe_test
          POSTGRES_USER: sameframe
          POSTGRES_PASSWORD: sameframe-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sameframe -d sameframe_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sameframe:sameframe-test@127.0.0.1:5432/sameframe_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: sh -n ../ops/backup/postgres-backup.sh
      - run: python3 -m json.tool ../ops/monitoring/grafana-dashboard.json >/dev/null
      - run: go build -trimpath -o ../bin/sameframe ./cmd/sameframe
      - run: go build -trimpath -o ../bin/sign-update ./cmd/sign-update
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-server-linux
          path: bin/sameframe
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-update-signer-linux
          path: bin/sign-update
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-admin-web
          path: server/internal/app/admin_web
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-production-operations
          path: ops

  flutter-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: node --test test/adaptive_media.test.cjs
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-web
          path: client/build/web

  flutter-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-windows
          path: client/build/windows/x64/runner/Release

  flutter-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: sameframe-linux-client
          path: client/build/linux/x64/release/bundle
