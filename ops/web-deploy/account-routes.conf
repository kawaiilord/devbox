# SameFrame lightweight account routes. Include inside each HTTPS server block.
gzip on;
gzip_vary on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf;

location = /login.html { return 308 /login$is_args$args; }
location = /register.html { return 308 /register$is_args$args; }
location = /forgot-password.html { return 308 /forgot-password$is_args$args; }
location = /app.html { return 308 /app$is_args$args; }
location = /login/ { return 308 /login$is_args$args; }
location = /register/ { return 308 /register$is_args$args; }
location = /forgot-password/ { return 308 /forgot-password$is_args$args; }
location = /app/ { return 308 /app$is_args$args; }

location = /login {
  root /usr/share/nginx/html;
  try_files /login.html =404;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
location = /register {
  root /usr/share/nginx/html;
  try_files /register.html =404;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
location = /forgot-password {
  root /usr/share/nginx/html;
  try_files /forgot-password.html =404;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
location = /app {
  root /usr/share/nginx/html;
  try_files /app.html =404;
  add_header Cache-Control "no-cache" always;
}
