<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="同帧 SameFrame · 和你想见的人，共享每一个好瞬间。">
  <title>找回登录密码 · 同帧</title>
  <link rel="icon" href="/favicon.svg?v=transparent-2" type="image/svg+xml">
  <link rel="canonical" href="https://sameframe.top/forgot-password">
  <link rel="stylesheet" href="/site/account.css">
  <script src="/appearance.js"></script>
  <script src="/site/device.js" defer></script>
  <script src="/site/account.js" defer></script>
</head>
<body data-account-mode="forgot-password">
  <header class="entry-header"><a class="brand" href="/" aria-label="同帧官网"><img src="/icons/frame-mark.svg" width="38" height="38" alt=""><span><strong>同帧</strong><small>SAMEFRAME</small></span></a><button class="theme-toggle" id="themeToggle" type="button" aria-label="切换为深色" title="切换为深色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></header>
  <main class="entry-main">
    <section class="entry-story" aria-label="同帧，一起看"><p class="eyebrow">SAMEFRAME / A SHARED MOMENT</p><h2>找回账号，<br><span>让故事继续。</span></h2><p class="story-description">一个放映室，一部好电影。<br>和你想见的人，共享每一个好瞬间。</p><div class="entry-art" aria-hidden="true"><div class="art-frame art-back"></div><div class="art-frame art-front"><svg viewBox="0 0 24 24"><path d="m8 4 13 8-13 8Z"/></svg></div></div><p class="story-signature">ONE FRAME. TOGETHER.</p></section>
    <section class="account-card" aria-labelledby="accountTitle">
      <div class="card-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></div>
      <h1 id="accountTitle">找回登录密码</h1><p class="form-intro" id="accountIntro">输入账号邮箱，获取密码重置邮件。</p>
      <form id="accountForm" class="account-form" method="post" action="/api/v1/auth/password/request">
        <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div>
        <div id="formMessage" class="form-message" role="alert" tabindex="-1" hidden></div>
        <button class="primary" id="submitAccount" type="submit" ><span>发送重置邮件</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
      </form>
      <form id="mfaForm" class="mfa-form" hidden><div class="field"><label for="mfaCode">动态验证码或恢复码</label><input id="mfaCode" name="mfa_code" autocomplete="one-time-code" maxlength="128" required></div><p id="mfaMessage" class="form-message error" role="alert" hidden></p><button id="submitMfa" class="primary" type="submit"><span>验证并登录</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><p class="form-switch"><button id="cancelMfa" class="text-button" type="button">使用其他账号</button></p></form>
      <p id="registrationStatus" class="rules-status" hidden><span id="rulesText">正在读取注册设置…</span><button id="retryRules" class="text-button" type="button" hidden>重试</button></p>
      <p class="form-switch" id="formSwitch"><a href="/login">返回登录</a></p>
      <noscript><p class="noscript">请启用 JavaScript 后提交账号信息。</p></noscript>
    </section>
  </main>
  <footer class="entry-footer">同帧 · 让每一幕，都有共鸣。</footer>
</body>
</html>
