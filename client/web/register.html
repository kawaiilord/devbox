<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="同帧 SameFrame · 和你想见的人，共享每一个好瞬间。">
  <title>创建同帧账号 · 同帧</title>
  <link rel="icon" href="/favicon.svg?v=transparent-2" type="image/svg+xml">
  <link rel="canonical" href="https://sameframe.top/register">
  <link rel="stylesheet" href="/site/account.css">
  <script src="/appearance.js"></script>
  <script src="/site/device.js" defer></script>
  <script src="/site/account.js" defer></script>
</head>
<body data-account-mode="register">
  <header class="entry-header"><a class="brand" href="/" aria-label="同帧官网"><img src="/icons/frame-mark.svg" width="38" height="38" alt=""><span><strong>同帧</strong><small>SAMEFRAME</small></span></a><button class="theme-toggle" id="themeToggle" type="button" aria-label="切换为深色" title="切换为深色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></header>
  <main class="entry-main">
    <section class="entry-story" aria-label="同帧，一起看"><p class="eyebrow">SAMEFRAME / A SHARED MOMENT</p><h2>下一场好故事，<br><span>从这里开始。</span></h2><p class="story-description">一个放映室，一部好电影。<br>和你想见的人，共享每一个好瞬间。</p><div class="entry-art" aria-hidden="true"><div class="art-frame art-back"></div><div class="art-frame art-front"><svg viewBox="0 0 24 24"><path d="m8 4 13 8-13 8Z"/></svg></div></div><p class="story-signature">ONE FRAME. TOGETHER.</p></section>
    <section class="account-card" aria-labelledby="accountTitle">
      <div class="card-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3m16-12v8m-4-4h8"/></svg></div>
      <h1 id="accountTitle">创建同帧账号</h1><p class="form-intro" id="accountIntro">为下一次相聚，留一个位置。</p>
      <form id="accountForm" class="account-form" method="post" action="/api/v1/auth/register">
        <div class="field"><label for="displayName">昵称</label><input id="displayName" name="display_name" autocomplete="nickname" minlength="2" maxlength="32" placeholder="你希望朋友如何称呼你" required></div><div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div><div class="field"><div class="label-row"><label for="password">密码</label></div><div class="password-input"><input id="password" name="password" type="password" autocomplete="new-password" minlength=10 maxlength="128" placeholder="至少 10 个字符" required><button type="button" id="passwordToggle" class="password-toggle" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field" id="inviteField" hidden><label for="inviteCode">邀请码</label><input id="inviteCode" name="invite_code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="填写管理员提供的邀请码" disabled></div>
<div class="field" id="codeField" hidden><label for="emailCode">邮箱验证码</label><div class="verification-row"><input id="emailCode" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位验证码" disabled><button id="sendCode" class="secondary" type="button" disabled>获取验证码</button></div><p id="codeHint" class="field-help" aria-live="polite"></p></div>
        <div id="formMessage" class="form-message" role="alert" tabindex="-1" hidden></div>
        <button class="primary" id="submitAccount" type="submit" disabled><span>创建账号</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
      </form>
      <form id="mfaForm" class="mfa-form" hidden><div class="field"><label for="mfaCode">动态验证码或恢复码</label><input id="mfaCode" name="mfa_code" autocomplete="one-time-code" maxlength="128" required></div><p id="mfaMessage" class="form-message error" role="alert" hidden></p><button id="submitMfa" class="primary" type="submit"><span>验证并登录</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><p class="form-switch"><button id="cancelMfa" class="text-button" type="button">使用其他账号</button></p></form>
      <p id="registrationStatus" class="rules-status"  ><span id="rulesText">正在读取注册设置…</span><button id="retryRules" class="text-button" type="button" hidden>重试</button></p>
      <p class="form-switch" id="formSwitch"><span>已经有账号？</span><a href="/login">登录</a></p>
      <noscript><p class="noscript">请启用 JavaScript 后提交账号信息。</p></noscript>
    </section>
  </main>
  <footer class="entry-footer">同帧 · 让每一幕，都有共鸣。</footer>
</body>
</html>
